name: firecrawl

x-common-service: &common-service
  image: ghcr.io/firecrawl/firecrawl:2.11.203-production

  ulimits:
    nofile:
      soft: 65535
      hard: 65535

  extra_hosts:
    - "host.docker.internal:host-gateway"

  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

  restart: unless-stopped

x-common-env: &common-env
  # ------------------------------------------------------------
  # Redis
  # ------------------------------------------------------------
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_RATE_LIMIT_URL: ${REDIS_RATE_LIMIT_URL:-redis://redis:6379}

  # ------------------------------------------------------------
  # Playwright
  # ------------------------------------------------------------
  PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright-service:3000/scrape}

  # ------------------------------------------------------------
  # PostgreSQL
  # ------------------------------------------------------------
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_HOST: ${POSTGRES_HOST:-nuq-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}

  USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}

  # ------------------------------------------------------------
  # Firecrawl workers
  # ------------------------------------------------------------
  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-8}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-10}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}
  BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-5}

  # ------------------------------------------------------------
  # AI / LLM
  # ------------------------------------------------------------
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  MODEL_NAME: ${MODEL_NAME:-}
  MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}

  # ------------------------------------------------------------
  # Firecrawl / integrations
  # ------------------------------------------------------------
  AUTUMN_SECRET_KEY: ${AUTUMN_SECRET_KEY:-}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  BULL_AUTH_KEY: ${BULL_AUTH_KEY:-}
  TEST_API_KEY: ${TEST_API_KEY:-}

  # ------------------------------------------------------------
  # Supabase
  # ------------------------------------------------------------
  SUPABASE_ANON_TOKEN: ${SUPABASE_ANON_TOKEN:-}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_SERVICE_TOKEN: ${SUPABASE_SERVICE_TOKEN:-}

  # ------------------------------------------------------------
  # Webhooks
  # ------------------------------------------------------------
  SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL:-}

  # ------------------------------------------------------------
  # Logging
  # ------------------------------------------------------------
  LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}

  # ------------------------------------------------------------
  # Proxy
  # ------------------------------------------------------------
  PROXY_SERVER: ${PROXY_SERVER:-}
  PROXY_USERNAME: ${PROXY_USERNAME:-}
  PROXY_PASSWORD: ${PROXY_PASSWORD:-}

  # ------------------------------------------------------------
  # SearXNG
  # ------------------------------------------------------------
  SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT:-}
  SEARXNG_ENGINES: ${SEARXNG_ENGINES:-}
  SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES:-}

  # ------------------------------------------------------------
  # NUQ
  #
  # IMPORTANT:
  # Firecrawl expects exactly "pg" or "fdb".
  #
  # Default is PostgreSQL.
  # ------------------------------------------------------------
  NUQ_BACKEND: ${NUQ_BACKEND:-pg}

  FDB_CLUSTER_FILE: ${NUQ_BACKEND:+/var/fdb/fdb.cluster}


services:

  # ============================================================
  # FIRECRAWL API
  # ============================================================

  api:
    <<: *common-service

    environment:
      <<: *common-env

      HOST: "0.0.0.0"
      PORT: ${INTERNAL_PORT:-3002}

      EXTRACT_WORKER_PORT: ${EXTRACT_WORKER_PORT:-3004}
      WORKER_PORT: ${WORKER_PORT:-3005}

      NUQ_RABBITMQ_URL: ${NUQ_RABBITMQ_URL:-amqp://rabbitmq:5672}

      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS:-60000}

      ENV: ${ENV:-production}

    depends_on:
      redis:
        condition: service_started

      playwright-service:
        condition: service_started

      rabbitmq:
        condition: service_healthy

      nuq-postgres:
        condition: service_started

    # Coolify routes the public domain to this port.
    expose:
      - "3002"

    volumes:
      - fdb-cluster-file:/var/fdb:ro

    command:
      - node
      - dist/src/harness.js
      - --start-docker

    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G


  # ============================================================
  # PLAYWRIGHT
  # ============================================================

  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest

    environment:
      PORT: "3000"

      PROXY_SERVER: ${PROXY_SERVER:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}

      # Firecrawl requires this to be a valid boolean string.
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS:-false}

      # Firecrawl requires this to be a valid boolean string.
      BLOCK_MEDIA: ${BLOCK_MEDIA:-false}

      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G

    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

    restart: unless-stopped


  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:alpine

    command:
      - redis-server
      - --bind
      - 0.0.0.0

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

    restart: unless-stopped


  # ============================================================
  # RABBITMQ
  # ============================================================

  rabbitmq:
    image: rabbitmq:3-management

    command:
      - rabbitmq-server

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - check_running
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

    restart: unless-stopped


  # ============================================================
  # NUQ POSTGRESQL
  # ============================================================

  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

    volumes:
      - nuq-postgres-data:/var/lib/postgresql/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

    restart: unless-stopped


  # ============================================================
  # FOUNDATIONDB
  #
  # OPTIONAL
  #
  # The default NUQ backend is PostgreSQL.
  #
  # To use FoundationDB, set:
  #
  #   NUQ_BACKEND=fdb
  #
  # in Coolify.
  # ============================================================

  foundationdb:
    image: foundationdb/foundationdb:7.3.63

    environment:
      FDB_NETWORKING_MODE: container
      FDB_COORDINATOR_PORT: "4500"

    volumes:
      - fdb-data:/var/fdb/data
      - fdb-cluster-file:/var/fdb

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

    restart: unless-stopped


  # ============================================================
  # FOUNDATIONDB INITIALIZATION
  #
  # One-shot initialization container.
  # ============================================================

  foundationdb-init:
    image: foundationdb/foundationdb:7.3.63

    depends_on:
      foundationdb:
        condition: service_started

    entrypoint:
      - /bin/bash
      - -c
      - |
        sleep 5

        out=$(
          fdbcli \
            -C /var/fdb/fdb.cluster \
            --exec 'configure new single ssd' \
            2>&1
        )

        status=$?

        printf '%s\n' "$out"

        if [ "$status" -eq 0 ]; then
          exit 0
        fi

        printf '%s\n' "$out" |
          grep -Eiq \
          'already.*configured|database.*configured|database.*already exists'

    volumes:
      - fdb-cluster-file:/var/fdb

    restart: "no"


# ==============================================================
# PERSISTENT STORAGE
# ==============================================================

volumes:

  # Firecrawl NUQ PostgreSQL database
  nuq-postgres-data:

  # FoundationDB data
  fdb-data:

  # FoundationDB cluster configuration
  fdb-cluster-file:
