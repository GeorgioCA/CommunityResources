name: signal

services:
  signal-cli-rest-api:
    image: bbernhard/signal-cli-rest-api:latest

    environment:
      MODE: json-rpc

    volumes:
      - signal-cli-config:/home/.local/share/signal-cli

    expose:
      - "8080"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - wget
        - "--spider"
        - "-q"
        - "http://127.0.0.1:8080"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  signal-cli-config:
